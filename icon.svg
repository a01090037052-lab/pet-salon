<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D70F5"/>
      <stop offset="1" stop-color="#5457DE"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 배경: 앱 기본색(인디고) 단색 계열. 마스커블 아이콘은 가장자리를 잘라내므로 모서리까지 꽉 채운다 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- 가위: 앱 안의 선 아이콘(#i-scissors)과 같은 형태 — 홈 화면과 앱 내부가 한 세트로 보이도록.
       안전 영역(중앙 80%) 안에 들어가며, 60px 크기에서도 읽히도록 굵은 선 -->
  <g transform="translate(256 256) rotate(-20) translate(-256 -256)" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="170" cy="186" r="52"/>
    <circle cx="170" cy="326" r="52"/>
    <path d="M214 212 L372 332"/>
    <path d="M214 300 L372 180"/>
  </g>
  <!-- 발자국: 반려견 살롱임을 알리는 작은 표식 (우하단, 안전 영역 안) -->
  <g fill="#ffffff" opacity="0.95" transform="translate(352 352) scale(1.15)">
    <circle cx="-22" cy="-16" r="8"/>
    <circle cx="-7" cy="-26" r="8"/>
    <circle cx="9" cy="-26" r="8"/>
    <circle cx="24" cy="-16" r="8"/>
    <path d="M1 -8c-15 0-27 12-27 23 0 7 5 10 11 10 5 0 9-3 16-3s11 3 16 3c6 0 11-3 11-10C28 4 16-8 1-8Z"/>
  </g>
</svg>
